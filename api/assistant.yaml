paths:
  /api/v1/assistant/chat:
    post:
      operationId: assistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
      responses:
        '200':
          description: Assistant long-poll response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatResponse'
  /api/v1/assistant/chats:
    get:
      operationId: listAssistantChats
      responses:
        '200':
          description: Persisted assistant chat summaries ordered by latest activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatsResponse'
  /api/v1/assistant/chats/{conversationID}:
    get:
      operationId: getAssistantChat
      parameters:
        - in: path
          name: conversationID
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Persisted assistant chat history including messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatHistory'
components:
  schemas:
    AssistantChatRequest:
      type: object
      properties:
        conversation_id:
          type: string
        request_id:
          type: string
        message:
          type: string
        wait_timeout_ms:
          type: integer
          format: int32
          minimum: 1
          maximum: 30000
    AssistantChatResponse:
      type: object
      required: [status, request_id, conversation_id]
      properties:
        status:
          type: string
          enum: [in_progress, completed, failed, rejected, disabled]
        request_id:
          type: string
        conversation_id:
          type: string
        answer:
          type: string
        error_message:
          type: string
        poll_after_ms:
          type: integer
          format: int32
          minimum: 1
        activity:
          type: array
          items:
            type: string
    AssistantTokenUsage:
      type: object
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        total_tokens:
          type: integer
          format: int64
          minimum: 0
    AssistantChatSummary:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        token_usage:
          $ref: '#/components/schemas/AssistantTokenUsage'
    AssistantChatsResponse:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/AssistantChatSummary'
    AssistantChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        activity:
          type: array
          items:
            type: string
    AssistantChatHistory:
      type: object
      required: [id, title, created_at, updated_at, messages]
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        token_usage:
          $ref: '#/components/schemas/AssistantTokenUsage'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantChatMessage'
