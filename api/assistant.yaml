paths:
  /api/assistant/suggestions:
    get:
      operationId: getAssistantSuggestions
      responses:
        '200':
          description: Best-effort assistant suggestions for an empty chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSuggestionsResponse'
  /api/v1/assistant/chat:
    post:
      operationId: assistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
      responses:
        '200':
          description: Assistant long-poll response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatResponse'
  /api/v1/assistant/chats:
    get:
      operationId: listAssistantChats
      responses:
        '200':
          description: Persisted assistant chat summaries ordered by latest activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatsResponse'
  /api/v1/assistant/chats/{conversationID}:
    get:
      operationId: getAssistantChat
      parameters:
        - in: path
          name: conversationID
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Persisted assistant chat history including messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatHistory'
  /api/v1/assistant/chats/{conversationID}/read:
    put:
      operationId: markAssistantChatRead
      parameters:
        - in: path
          name: conversationID
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatReadRequest'
      responses:
        '204':
          description: Read state updated if the viewed reply is still the latest.
  /api/v1/assistant/usage:
    get:
      operationId: getAssistantUsage
      summary: Read assistant token totals grouped by chat creation date
      parameters:
        - in: query
          name: from
          required: true
          description: Inclusive start date in UTC.
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          description: Exclusive end date in UTC.
          schema:
            type: string
            format: date
        - in: query
          name: interval
          required: true
          description: Calendar bucket size in UTC. Weeks start on Monday.
          schema:
            $ref: '#/components/schemas/AssistantUsageInterval'
      responses:
        '200':
          description: Accumulated token totals grouped by the UTC creation dates of chats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantUsageResponse'
components:
  schemas:
    AssistantSuggestion:
      type: object
      required: [id, title, prompt]
      properties:
        id:
          type: string
        title:
          type: string
        prompt:
          type: string
    AssistantSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/AssistantSuggestion'
    AssistantChatRequest:
      type: object
      properties:
        conversation_id:
          type: string
        request_id:
          type: string
        message:
          type: string
        read_only:
          type: boolean
          default: false
          description: Creates a chat where writable assistant tools are disabled.
        wait_timeout_ms:
          type: integer
          format: int32
          minimum: 1
          maximum: 30000
    AssistantChatResponse:
      type: object
      required: [status, request_id, conversation_id]
      properties:
        status:
          type: string
          enum: [in_progress, completed, failed, rejected, disabled]
        request_id:
          type: string
        conversation_id:
          type: string
        read_only:
          type: boolean
          description: Whether writable assistant tools are disabled for the chat. Omitted when the chat mode is unknown.
        outcome:
          type: string
          description: Machine-readable result of the request. Currently operation_blocked when a requested operation was not started.
        restriction:
          type: string
          description: Restriction that produced the outcome. Currently read_only.
        operation:
          type: string
          description: Name of the requested operation associated with the outcome.
        answer:
          type: string
        answer_sequence:
          type: integer
          minimum: 0
          description: Persisted sequence of the completed answer, when available.
        error_message:
          type: string
        poll_after_ms:
          type: integer
          format: int32
          minimum: 1
        activity:
          type: array
          items:
            type: string
        selection:
          $ref: '#/components/schemas/AssistantSelection'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/AssistantArtifact'
    AssistantArtifact:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          minLength: 1
          description: Extensible artifact kind. Initial values are pull_request and git_branch.
        label:
          type: string
          minLength: 1
        url:
          type: string
    AssistantTokenUsage:
      type: object
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        total_tokens:
          type: integer
          format: int64
          minimum: 0
    AssistantChatSummary:
      type: object
      required: [id, title, created_at, updated_at, unread, read_only]
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        unread:
          type: boolean
        read_only:
          type: boolean
        token_usage:
          $ref: '#/components/schemas/AssistantTokenUsage'
        primary_artifact:
          $ref: '#/components/schemas/AssistantArtifact'
    AssistantChatsResponse:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/AssistantChatSummary'
    AssistantChatReadRequest:
      type: object
      required: [sequence]
      properties:
        sequence:
          type: integer
          minimum: 0
          description: Persisted sequence of the assistant reply that was viewed.
    AssistantChatMessage:
      type: object
      required: [role, content, sequence]
      properties:
        sequence:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        activity:
          type: array
          items:
            type: string
        selection:
          $ref: '#/components/schemas/AssistantSelection'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/AssistantArtifact'
    AssistantSelection:
      type: object
      required: [options]
      properties:
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssistantSelectionOption'
    AssistantSelectionOption:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          minLength: 1
        description:
          type: string
        value:
          type: string
          minLength: 1
    AssistantChatHistory:
      type: object
      required: [id, title, created_at, updated_at, unread, read_only, messages]
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        unread:
          type: boolean
        read_only:
          type: boolean
        token_usage:
          $ref: '#/components/schemas/AssistantTokenUsage'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantChatMessage'
        active_request:
          $ref: '#/components/schemas/AssistantActiveChatRequest'
    AssistantActiveChatRequest:
      type: object
      description: Reply that is still being generated. Poll it with request_id to continue the chat after a page reload.
      required: [request_id]
      properties:
        request_id:
          type: string
        activity:
          type: array
          items:
            type: string

    AssistantUsageInterval:
      type: string
      enum: [daily, weekly, monthly]
    AssistantUsageBucket:
      allOf:
        - $ref: '#/components/schemas/AssistantTokenUsage'
        - type: object
          required: [start]
          properties:
            start:
              type: string
              format: date
              description: UTC calendar bucket start. A partial bucket counts only chats created within the requested range.
    AssistantUsageResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          description: Ascending buckets with zeros between populated buckets. Empty when no chats with token totals were created in the range.
          items:
            $ref: '#/components/schemas/AssistantUsageBucket'
