paths:
  /api/v1/recommendations:
    get:
      operationId: listRecommendations
      parameters:
        - in: query
          name: stack
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Stored recommendations from the recommendations subsystem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
components:
  schemas:
    RecommendationsResponse:
      type: object
      required: [recommendations]
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
    RecommendationSubject:
      type: object
      required: [stack, service]
      properties:
        stack:
          type: string
        service:
          type: string
    RecommendationSource:
      type: object
      required: [file, digest, commit]
      properties:
        file:
          type: string
        digest:
          type: string
        commit:
          type: string
    Recommendation:
      type: object
      required: [severity, type, source, subject, title, recommendation, created_at]
      properties:
        severity:
          type: string
        type:
          type: string
        source:
          $ref: '#/components/schemas/RecommendationSource'
        subject:
          $ref: '#/components/schemas/RecommendationSubject'
        title:
          type: string
        recommendation:
          type: string
        created_at:
          type: string
          format: date-time
