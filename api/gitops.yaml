paths:
  /api/v1/stacks:
    get:
      operationId: listStacks
      responses:
        '200':
          description: List of tracked stacks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StacksResponse'
              examples:
                development:
                  $ref: './mocks/overview.yaml#/components/examples/StacksResponse'
  /api/v1/stacks/{stack}/resources:
    get:
      operationId: getStackResources
      description: |
        Current Docker resources owned by a configured stack, selected by the exact
        com.docker.stack.namespace label. Unlabelled external resources are excluded.
        Returns metadata only, never secret values or config payloads.
      parameters:
        - in: path
          name: stack
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Complete metadata lists of stack-owned resources; empty arrays mean zero resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackResourcesResponse'
  /api/v1/stacks/{stack}/sync-pauses:
    get:
      operationId: getStackSyncPauses
      parameters:
        - $ref: '#/components/parameters/StackName'
      responses:
        '200':
          description: Active stack pause and the calculated effectively paused service count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackSyncPausesResponse'
        '404':
          description: Stack is not managed by GitOps.
  /api/v1/stacks/{stack}/sync-pause:
    put:
      operationId: putStackSyncPause
      parameters:
        - $ref: '#/components/parameters/StackName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPauseRequest'
      responses:
        '200':
          description: Current stack pause state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackSyncPausesResponse'
    delete:
      operationId: deleteStackSyncPause
      parameters:
        - $ref: '#/components/parameters/StackName'
      responses:
        '204':
          description: Stack pause removed.
  /api/v1/stacks/{stack}/manifestos:
    get:
      operationId: getStackManifestos
      parameters:
        - in: path
          name: stack
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Desired and live manifests for a stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackManifestosResponse'
  /api/v1/git/commits/{commit}:
    get:
      operationId: getGitCommit
      parameters:
        - in: path
          name: commit
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Git commit details by hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommitDetailsResponse'
  /api/v1/sync:
    post:
      operationId: triggerSync
      responses:
        '202':
          description: Sync trigger accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
components:
  parameters:
    StackName:
      in: path
      name: stack
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    SyncPauseRequest:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Absolute expiration; null means no expiration.
    SyncPauseRecord:
      type: object
      required: [stack, expires_at]
      properties:
        stack:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    StackSyncPausesResponse:
      type: object
      required: [effectively_paused_services]
      properties:
        stack_pause:
          $ref: '#/components/schemas/SyncPauseRecord'
        effectively_paused_services:
          type: integer
          description: Number of GitOps-managed services covered by the active stack pause.
          minimum: 0
    StackResourceInfo:
      type: object
      description: Resource identity without values, configuration data or labels.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    StackResourcesResponse:
      type: object
      required: [networks, secrets, configs]
      properties:
        networks:
          type: array
          items:
            $ref: './resources/networks.yaml#/components/schemas/NetworkInfo'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/StackResourceInfo'
        configs:
          type: array
          items:
            $ref: '#/components/schemas/StackResourceInfo'
    QueueResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
    SyncInfo:
      type: object
      description: GitOps input status. These values do not report stack deployment success.
      properties:
        last_poll:
          $ref: '#/components/schemas/LastPollStatus'
        last_webhook:
          $ref: '#/components/schemas/LastWebhookStatus'
        last_revision:
          type: string
          description: Full Git revision most recently dispatched to the stack queue.
    LastPollStatus:
      type: object
      description: Latest Git polling attempt. Empty when polling is active but no attempt is recorded.
      properties:
        at:
          type: string
          format: date-time
        result:
          type: string
          enum: [updated, no_change, error]
        error:
          type: string
          description: Sanitized diagnostic; empty when the attempt did not fail.
    LastWebhookStatus:
      type: object
      description: Latest retained WebhookReceived event. Empty when webhooks are enabled but none is retained.
      properties:
        event_id:
          type: string
        at:
          type: string
          format: date-time
        queued:
          type: boolean
    GitCommitDetailsResponse:
      type: object
      required: [full_hash, author, message, date, changed_files]
      properties:
        full_hash:
          type: string
        author:
          type: string
        message:
          type: string
        date:
          type: string
          format: date-time
        changed_files:
          type: array
          items:
            type: string
    StackStatus:
      type: object
      required: [synced, out_of_synced]
      properties:
        synced:
          type: integer
          format: int64
          minimum: 0
        out_of_synced:
          type: integer
          format: int64
          minimum: 0
    StackView:
      type: object
      required: [name, compose_file, status]
      properties:
        name:
          type: string
        compose_file:
          type: string
        status:
          $ref: '#/components/schemas/StackStatus'
        last_error:
          type: string
        last_commit:
          type: string
        last_deploy_at:
          type: string
          format: date-time
        source_digest:
          type: string
        effectively_paused_services:
          type: integer
          minimum: 0
    StacksResponse:
      type: object
      required: [stacks, sync]
      properties:
        stacks:
          type: array
          items:
            $ref: '#/components/schemas/StackView'
        sync:
          $ref: '#/components/schemas/SyncInfo'
    StackManifestosResponse:
      type: object
      required: [desired, live]
      properties:
        desired:
          type: string
        live:
          type: string
