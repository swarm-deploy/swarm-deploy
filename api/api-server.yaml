    $ref: './resources/secret-managers.yaml#/paths/~1api~1v1~1secret-managers'
  /api/v1/secret-managers/{stack}/{service}/sync:
    $ref: './resources/secret-managers.yaml#/paths/~1api~1v1~1secret-managers~1{stack}~1{service}~1sync'
  /api/v1/stacks/{stack}/services/{service}:
    $ref: './resources/services.yaml#/paths/~1api~1v1~1stacks~1{stack}~1services~1{service}'
  /api/v1/stacks/{stack}/services/{service}/realtime:
    $ref: './resources/services.yaml#/paths/~1api~1v1~1stacks~1{stack}~1services~1{service}~1realtime'
  /api/tasks/{taskID}/logs:
    $ref: './resources/services.yaml#/paths/~1api~1tasks~1{taskID}~1logs'
  /api/v1/stacks/{stack}/services/{service}/deployments:
    $ref: './resources/services.yaml#/paths/~1api~1v1~1stacks~1{stack}~1services~1{service}~1deployments'
  /api/v1/search:
    $ref: './search.yaml#/paths/~1api~1v1~1search'
  /api/v1/users/me:
    $ref: './users.yaml#/paths/~1api~1v1~1users~1me'
