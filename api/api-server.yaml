openapi: 3.0.3
info:
  title: Swarm Deploy API
  version: 0.1.0
  description: |
    MVP API for Swarm Deploy.
    Includes stack status and manual sync endpoint.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/deployments:
    $ref: './deployments.yaml#/paths/~1api~1v1~1deployments'
  /api/v1/deployments/{id}:
    $ref: './deployments.yaml#/paths/~1api~1v1~1deployments~1{id}'
  /api/v1/stacks:
    $ref: './gitops.yaml#/paths/~1api~1v1~1stacks'
  /api/v1/stacks/{stack}/manifestos:
    $ref: './gitops.yaml#/paths/~1api~1v1~1stacks~1{stack}~1manifestos'
  /api/v1/git/commits/{commit}:
    $ref: './gitops.yaml#/paths/~1api~1v1~1git~1commits~1{commit}'
  /api/v1/sync:
    $ref: './gitops.yaml#/paths/~1api~1v1~1sync'
  /api/v1/assistant/chat:
    $ref: './assistant.yaml#/paths/~1api~1v1~1assistant~1chat'
  /api/v1/assistant/chats:
    $ref: './assistant.yaml#/paths/~1api~1v1~1assistant~1chats'
  /api/v1/assistant/chats/{conversationID}:
    $ref: './assistant.yaml#/paths/~1api~1v1~1assistant~1chats~1{conversationID}'
  /api/v1/events:
    $ref: './events.yaml#/paths/~1api~1v1~1events'
  /api/v1/alerts:
    $ref: './events.yaml#/paths/~1api~1v1~1alerts'
  /api/v1/alerts/{id}:
    $ref: './events.yaml#/paths/~1api~1v1~1alerts~1{id}'
  /api/v1/recommendations:
    $ref: './recommendations.yaml#/paths/~1api~1v1~1recommendations'
  /api/v1/services:
    $ref: './resources/services.yaml#/paths/~1api~1v1~1services'
  /api/v1/graph:
    $ref: './resources/graph.yaml#/paths/~1api~1v1~1graph'
  /api/v1/nodes:
    $ref: './resources/nodes.yaml#/paths/~1api~1v1~1nodes'
  /api/v1/nodes/{id}/labels:
    $ref: './resources/nodes.yaml#/paths/~1api~1v1~1nodes~1{id}~1labels'
  /api/v1/nodes/{id}/labels/{key}:
    $ref: './resources/nodes.yaml#/paths/~1api~1v1~1nodes~1{id}~1labels~1{key}'
  /api/v1/networks:
    $ref: './resources/networks.yaml#/paths/~1api~1v1~1networks'
  /api/v1/secrets:
    $ref: './resources/secrets.yaml#/paths/~1api~1v1~1secrets'
  /api/v1/secrets/{name}:
    $ref: './resources/secrets.yaml#/paths/~1api~1v1~1secrets~1{name}'
