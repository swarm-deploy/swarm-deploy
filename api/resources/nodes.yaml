paths:
  /api/v1/nodes:
    get:
      operationId: listNodes
      responses:
        '200':
          description: Current Docker Swarm nodes snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodesResponse'
  /api/v1/nodes/{id}/labels:
    post:
      operationId: addNodeLabel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeLabelCreateRequest'
      responses:
        '204':
          description: Node label added.
  /api/v1/nodes/{id}/labels/{key}:
    put:
      operationId: updateNodeLabel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeLabelUpdateRequest'
      responses:
        '204':
          description: Node label updated.
    delete:
      operationId: deleteNodeLabel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Node label removed.
components:
  schemas:
    NodesResponse:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeInfo'
    NodeInfo:
      type: object
      required: [id, hostname, status, availability, manager_status, engine_version, addr, cpu_nano, memory_bytes]
      properties:
        id:
          type: string
        hostname:
          type: string
        status:
          type: string
        availability:
          type: string
        manager_status:
          type: string
        engine_version:
          type: string
        addr:
          type: string
        cpu_nano:
          type: integer
          format: int64
          minimum: 0
        memory_bytes:
          type: integer
          format: int64
          minimum: 0
        labels:
          type: object
          additionalProperties:
            type: string
    NodeLabelCreateRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          minLength: 1
        value:
          type: string
    NodeLabelUpdateRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
