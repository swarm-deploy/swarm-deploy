paths:
  /api/v1/secrets:
    get:
      operationId: listSecrets
      responses:
        '200':
          description: Current Docker Swarm secrets snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsResponse'
  /api/v1/secrets/{name}:
    get:
      operationId: getSecretByName
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed secret metadata by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretDetailsResponse'
components:
  schemas:
    SecretsResponse:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretInfo'
    SecretInfo:
      type: object
      required: [id, name, version_id, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version_id:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        external:
          $ref: '#/components/schemas/SecretExternalInfo'
    SecretDetailsResponse:
      type: object
      required: [id, name, version_id, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        version_id:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        driver:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        external:
          $ref: '#/components/schemas/SecretExternalInfo'
    SecretExternalInfo:
      type: object
      properties:
        path:
          type: string
        version_id:
          type: string
