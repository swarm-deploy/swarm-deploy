service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_storage:
    backends:
      testenv:
        memory:
          max_traces: 10000
  jaeger_query:
    storage:
      traces: testenv
    http:
      endpoint: 0.0.0.0:16686
    ai:
      agent_url: ""
      mcp: {}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: testenv
