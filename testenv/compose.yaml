services:
  swarm-deploy:
    build:
      context: ..
    image: swarm-deploy:testenv
    depends_on:
      git:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      OTEL_SERVICE_NAME: swarm-deploy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./swarm-deploy.yaml:/etc/swarm-deploy/swarm-deploy.yaml:ro
      - swarm-deploy-data:/etc/swarm-deploy/.swarm-deploy
    secrets:
      - openai_api_token
    stop_grace_period: 30s

  git:
    build: ./git
    command: ["daemon", "--export-all", "--base-path=/srv/git", "--strict-paths", "/srv/git/stacks.git"]
    volumes:
      - ./.gitops.git:/srv/git/stacks.git:ro
    healthcheck:
      test: ["CMD", "git", "ls-remote", "--exit-code", "git://127.0.0.1/stacks.git", "HEAD"]
      interval: 2s
      timeout: 2s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    command: ["--config", "/jaeger/config.yaml"]
    volumes:
      - ./jaeger.yaml:/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"

secrets:
  openai_api_token:
    file: ./.openai-api-token

volumes:
  swarm-deploy-data:
