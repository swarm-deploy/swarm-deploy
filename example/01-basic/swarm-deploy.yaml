# Git repository settings for stack manifests.
git:
  # Repository URL (ssh/https).
  repository: https://github.com/your-org/your-stacks-repo.git
  # Branch to synchronize.
  branch: main
  # Git authentication settings.
  auth:
    # Authentication type: none | http | ssh.
    type: none

# Git-to-deploy synchronization settings.
sync:
  # Synchronization mode: pull | webhook | hybrid.
  mode: pull
  # Git polling interval.
  pollInterval: 30s
  # Reconciliation interval against the current local desired state.
  interval: 1m
  policy:
    # Removes orphaned managed services that are no longer defined in compose.
    prune: true
    # Optional service image reference rules. All are disabled by default.
    image:
      tag:
        required: false
        no_latest: false
        only_sha: false

# Stacks source settings.
stacks:
  # Path to stacks definition file in git repository (relative to repo root).
  file: ./stacks.yaml

# Managed Docker networks source settings.
networks:
  # Path to network definitions file in git repository (relative to repo root).
  file: ./networks.yaml

# Event history settings.
eventHistory:
  # Maximum number of events stored on disk.
  capacity: 500

# Notification transport, automatic alert delivery and explicit event subscriptions.
notifications:
  messengers:
    telegram:
      botTokenPath: /run/secrets/telegram_bot_token
      chats:
        default:
          id: "-1001234567890"
          threadId: 42
        deployments:
          id: "-1001234567890"
          threadId: 155
  events:
    DeploySuccess:
      telegram:
        - chats: deployments
          message: |
            💚 deploy {{ .Status }}
            stack: {{ .StackName }}
      custom:
        - name: success-webhook
          url: https://hooks.example.com/deploy-success
          method: POST
          header:
            Content-Type: application/json
    SyncManualStarted:
      telegram:
        - message: |
            sync started manually
  alerts:
    sync_failed:
      telegram:
        - chats: deployments
          opened:
            message: "🔴 Synchronization failed: {{ .ResourceID }}"
          resolved:
            action: edit
            message: "✅ Synchronization recovered: {{ .ResourceID }}"

# Secret/config name rotation settings.
secretRotation:
  # Enable rotation.
  enabled: true
  # Hash suffix length.
  hashLength: 10
  # Include source file path in hash.
  includePath: true
  # Best-effort cleanup of old managed generations.
  cleanup:
    enabled: true
    # Minimum interval between periodic cleanup attempts.
    interval: 4h
    # Keep at least this many newest generations per logical config/secret.
    keepLast: 2
    # Never remove generations younger than this age.
    minAge: 1h

# Container runtime settings.
containers:
  # Inject Swarm downward environment variables into services.
  downward: {}

# OpenTelemetry tracing. Uncomment to enable.
# tracing:
#   # OTLP transport: http | grpc.
#   transport: http
#   sampler:
#     # Sampling strategy: always_on | always_off | traceidratio | parentbased_traceidratio.
#     strategy: ${OTEL_TRACES_SAMPLER}
#     # Sampling ratio for traceidratio strategies. Must be between 0 and 1.
#     ratio: ${OTEL_TRACES_SAMPLER_ARG}
#   exporter:
#     endpoint: $OTEL_EXPORTER_OTLP_ENDPOINT
#     # Header values can reference environment variables.
#     # Authorization must be configured via authentication.bearerPath or authentication.apiKeyPath.
#     headers:
#       x-tenant: $OTEL_TENANT
#     authentication:
#       # Optional path to a file containing bearer token.
#       bearerPath: /run/secrets/otel-bearer
#       # Optional path to a file containing API key for Authorization: Api-Key <value>.
#       apiKeyPath: /run/secrets/otel-api-key
#       # Optional path to a file containing x-api-key.
#       xApiKeyPath: /run/secrets/otel-x-api-key

# Docker stack deploy execution settings.
swarm:
  # Docker CLI command.
  command: docker
  # Stack deploy command arguments.
  stackDeployArgs:
    - stack
    - deploy
    - --with-registry-auth
  # Init job polling interval.
  initJobPollEvery: 2s
  # Maximum init job duration.
  initJobMaxDuration: 10m

# UI and API web server address.
web:
  # Single web server listen address for UI and API.
  address: ":8080"

# Dedicated health/metrics server.
healthServer:
  # Health/metrics server listen address.
  address: ":8082"
  # Metrics endpoint settings.
  metrics:
    # Prometheus metrics HTTP path.
    path: /metrics
  # Health endpoint settings.
  healthz:
    # Health-check HTTP path.
    path: /healthz
