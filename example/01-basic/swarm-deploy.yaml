#         xApiKeyPath: /run/secrets/otel-x-api-key

# Deployment polling and Init Job settings.
deployments:
  # Polling interval for Init Jobs and service convergence.
  pollInterval: 2s
  initJobs:
    # Maximum init job duration.
    maxDuration: 10m

# UI and API web server address.
web:
  # Single web server listen address for UI and API.
  address: ":8080"
  # URL prefix for UI and API routes. Use / for root deployment.
  basePath: /
  # Optional links in the Fields tab of parsed task logs. Use the exact field
  # name and an absolute HTTP(S) URL. The UI replaces {value} with the encoded field value.
  # ui:
  #   logViewer:
  #     linkFields:
  #       trace_id: "http://tracer.example/{value}"

# Dedicated health/metrics server.
healthServer:
  # Health/metrics server listen address.
  address: ":8082"
  # Metrics endpoint settings.
  metrics:
    # Prometheus metrics HTTP path.
    path: /metrics
  # Health endpoint settings.
  healthz:
    # Health-check HTTP path.
    path: /healthz
