gitops:
  # Git repository settings for stack manifests.
  git:
    # Repository URL (ssh/https).
    repository: https://github.com/your-org/your-stacks-repo.git
    # Branch to synchronize.
    branch: main
    # Git authentication settings.
    auth:
      # Authentication type: none | http | ssh.
      type: none
    pull:
      # Git polling interval.
      interval: 30s
      # Maximum time for Git pull, including waiting for repository access. Defaults to 2m.
      timeout: 2m

  # Git-to-deploy synchronization settings.
  sync:
    # Synchronization mode: pull | webhook | hybrid.
    mode: pull
    # Reconciliation interval against the current local desired state.
    interval: 1m
    # Maximum number of stacks reconciled at the same time. Defaults to 1.
    # Set to 4 explicitly to enable parallel deployments across different stacks.
    parallelism: 1
    policy:
      # Removes orphaned managed services that are no longer defined in compose.
      prune: true
      # Reapplies services whose live state differs from the desired state.
      selfHeal: true
      # Optional service image reference rules. All are disabled by default.
      image:
        tag:
          required: false
          no_latest: false
          only_sha: false

  # Stacks source settings.
  stacks:
    # Path to stacks definition file in git repository (relative to repo root).
    file: ./stacks.yaml

  # Managed Docker networks source settings.
  networks:
    # Path to network definitions file in git repository (relative to repo root).
    file: ./networks.yaml

  injection:
    # Inject Swarm downward environment variables into services.
    downward:
      enabled: true

  # Optional age identity file; works even when rotation is disabled.
  # secrets:
  #   age:
  #     identityFile: /run/secrets/swarm_deploy_age_identity

  # Secret/config name rotation settings.
  resourceRotation:
    # Enable rotation.
    enabled: true
    # Hash suffix length.
    hashLength: 10
    # Include source file path in hash.
    includePath: true
    # Best-effort cleanup of old managed generations.
    cleanup:
      enabled: true
      # Minimum interval between periodic cleanup attempts.
      interval: 4h
      # Keep at least this many newest generations per logical config/secret.
      keepLast: 2
      # Never remove generations younger than this age.
      minAge: 1h

# Event history settings.
event:
  history:
    # Maximum number of events stored on disk.
    capacity: 500

# Notification transport, automatic alert delivery and explicit event subscriptions.
notifications:
  messengers:
    telegram:
      botTokenPath: /run/secrets/telegram_bot_token
      chats:
        default:
          id: "-1001234567890"
          threadId: 42
        deployments:
          id: "-1001234567890"
          threadId: 155
  events:
    DeploySuccess:
      telegram:
        - chats: deployments
          message: |
            💚 deploy {{ .Status }}
            stack: {{ .StackName }}
      custom:
        - name: success-webhook
          url: https://hooks.example.com/deploy-success
          method: POST
          header:
            Content-Type: application/json
    SyncManualStarted:
      telegram:
        - message: |
            sync started manually
  alerts:
    SyncFailed:
      telegram:
        - chats: deployments
          opened:
            message: "🔴 Synchronization failed: {{ .ResourceID }}"
          resolved:
            action: edit
            message: "✅ Synchronization recovered: {{ .ResourceID }}"

