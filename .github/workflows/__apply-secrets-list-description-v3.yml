name: Apply secrets list description fix v3

on:
  push:
    branches:
      - fix/secrets-list-description

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/secrets-list-description
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          def require_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"replacement target not found: {label}")
              return text.replace(old, new, 1)

          api = Path("api/api-server.yaml")
          text = api.read_text()
          start = text.index("    SecretInfo:\n")
          end = text.index("\n    SecretExternalInfo:", start)
          block = text[start:end]
          block = require_replace(block, "        name:\n          type: string\n", "        name:\n          type: string\n        description:\n          type: string\n", "SecretInfo.description")
          api.write_text(text[:start] + block + text[end:])

          mapper = Path("internal/entrypoints/webserver/handlers/mappers.go")
          text = mapper.read_text()
          start = text.index("func toGeneratedSecrets(")
          prefix = text[:start]
          block = text[start:]
          block = require_replace(block, "\t\t\tName:      secret.Name,\n", "\t\t\tName:        secret.Name,\n\t\t\tDescription: toOptString(secret.Description),\n", "toGeneratedSecrets description mapping")
          mapper.write_text(prefix + block)

          types = Path("ui/src/api/types.ts")
          text = types.read_text()
          start = text.index("export interface SecretInfo {")
          end = text.index("\n}\n\nexport interface SecretsResponse", start)
          block = text[start:end]
          block = require_replace(block, "  name: string;\n", "  name: string;\n  description?: string;\n", "SecretInfo.description UI type")
          types.write_text(text[:start] + block + text[end:])

          view = Path("ui/src/views/SecretsView.vue")
          text = view.read_text()
          text = require_replace(text, 'import { fetchSecretByName, fetchSecretManagers, fetchSecrets, syncSecretManager } from "../api/secrets";', 'import { fetchSecretManagers, fetchSecrets, syncSecretManager } from "../api/secrets";', "remove detail fetch import")
          text = require_replace(text, 'const secretDescriptions = ref<Record<string, string>>({});\nlet descriptionLoadGeneration = 0;\n', '', "remove description side state")
          text = require_replace(text, 'const showDescriptionColumn = computed(() =>\n  Object.values(secretDescriptions.value).some((description) => description !== ""),\n);', 'const showDescriptionColumn = computed(() =>\n  secrets.value.some((secret) => Boolean(secret.description?.trim())),\n);', "description column source")
          text = require_replace(text, '    const description = secretDescriptions.value[secret.name] ?? "";', '    const description = secret.description ?? "";', "description search source")
          fn_start = text.index("async function loadSecretDescriptions(")
          fn_end = text.index("\nasync function loadSecrets()", fn_start)
          text = text[:fn_start] + text[fn_end + 1:]
          text = require_replace(text, '    const response = await fetchSecrets();\n    const nextSecrets = sortSecrets(Array.isArray(response.secrets) ? response.secrets : []);\n    secrets.value = nextSecrets;\n    secretDescriptions.value = {};\n\n    const generation = ++descriptionLoadGeneration;\n    void loadSecretDescriptions(nextSecrets, generation);', '    const response = await fetchSecrets();\n    secrets.value = sortSecrets(Array.isArray(response.secrets) ? response.secrets : []);', "single list request load")
          text = require_replace(text, '    secrets.value = [];\n    secretDescriptions.value = {};\n    descriptionLoadGeneration++;', '    secrets.value = [];', "remove description error state")
          text = require_replace(text, '{{ secretDescriptions[secret.name] || "n/a" }}', '{{ secret.description || "n/a" }}', "render list description")
          view.write_text(text)

          test = Path("internal/entrypoints/webserver/handlers/mappers_secrets_test.go")
          test.write_text('''package handlers\n\nimport (\n\t"testing"\n\n\tsecretmodel "github.com/swarm-deploy/swarm-deploy/internal/modules/resources/secrets/model"\n)\n\nfunc TestToGeneratedSecretsIncludesDescription(t *testing.T) {\n\tmapped := toGeneratedSecrets([]secretmodel.Secret{{\n\t\tID:          "secret-id",\n\t\tName:        "database-password",\n\t\tDescription: "Database password",\n\t}})\n\n\tif len(mapped) != 1 {\n\t\tt.Fatalf("expected one mapped secret, got %d", len(mapped))\n\t}\n\n\tdescription := mapped[0].Description\n\tif !description.Set {\n\t\tt.Fatal("expected description to be set")\n\t}\n\tif description.Value != "Database password" {\n\t\tt.Fatalf("unexpected description: %q", description.Value)\n\t}\n}\n''')

      - name: Regenerate OpenAPI
        run: go run -mod=mod github.com/ogen-go/ogen/cmd/ogen@v1.20.1 --target ./internal/entrypoints/webserver/generated --clean ./api/api-server.yaml

      - name: Format and test backend mapping
        run: |
          gofmt -w internal/entrypoints/webserver/handlers/mappers.go internal/entrypoints/webserver/handlers/mappers_secrets_test.go
          go test ./internal/entrypoints/webserver/handlers

      - name: Build and test UI
        working-directory: ui
        run: |
          npm ci
          npm run build
          npm test

      - name: Commit result
        run: |
          rm .github/workflows/__apply-secrets-list-description.yml .github/workflows/__apply-secrets-list-description-v2.yml .github/workflows/__apply-secrets-list-description-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: avoid N+1 requests on secrets page"
          git push origin HEAD:fix/secrets-list-description
