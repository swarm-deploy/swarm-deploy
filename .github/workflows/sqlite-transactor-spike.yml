name: SQLite transactor spike

on:
  push:
    branches:
      - feat/sqlite-outbox-refactor
    paths:
      - 'experiments/sqlite-transactor/**'
      - '.github/workflows/sqlite-transactor-spike.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - name: Resolve spike dependencies
        working-directory: experiments/sqlite-transactor
        run: go mod tidy
      - name: Verify pure-Go SQLite transaction behavior
        working-directory: experiments/sqlite-transactor
        env:
          CGO_ENABLED: '0'
        run: go test -v ./...
      - name: Verify concurrent access with race detector
        working-directory: experiments/sqlite-transactor
        env:
          CGO_ENABLED: '1'
        run: go test -race -v ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - name: Verify integrated application without CGO
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...
      - name: Verify transactions, workers and projections under race detector
        env:
          CGO_ENABLED: '1'
        run: >-
          go test -race -count=1 ./internal/storage ./internal/legacyimport
          ./internal/modules/event/... ./internal/modules/gitops/...
          ./internal/modules/resources/... ./internal/modules/alertmanagement/...
          ./internal/modules/recommendations/... ./internal/modules/assistant/...
