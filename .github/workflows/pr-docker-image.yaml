name: PR Docker image

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PACKAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build PR image
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          tag="$(printf '%s' "$BRANCH_NAME" | sed -E 's#[^A-Za-z0-9_.-]+#-#g; s#^[.-]+##; s#[.-]+$##' | cut -c1-128)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Remove previous branch image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          status="$(curl -sS             -o "$RUNNER_TEMP/package-versions.json"             -w '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions?per_page=100")"

          if [ "$status" = "404" ]; then
            exit 0
          fi

          test "$status" = "200"

          jq -r --arg tag "$TAG"             '.[] | select(.metadata.container.tags | index($tag)) | .id'             "$RUNNER_TEMP/package-versions.json" |
          while read -r version_id; do
            gh api               --method DELETE               "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions/$version_id"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate build values
        id: build
        run: echo "timestamp=$(date +%FT%T%z)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.image.outputs.tag }}
            BUILD_TIME=${{ steps.build.outputs.timestamp }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

  cleanup:
    name: Delete PR image
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Generate image tag
        id: image
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          tag="$(printf '%s' "$BRANCH_NAME" | sed -E 's#[^A-Za-z0-9_.-]+#-#g; s#^[.-]+##; s#[.-]+$##' | cut -c1-128)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Delete branch image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          gh api             --paginate             "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions?per_page=100" |
          jq -sr --arg tag "$TAG"             'add | .[] | select(.metadata.container.tags | index($tag)) | .id' |
          while read -r version_id; do
            gh api               --method DELETE               "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE_NAME/versions/$version_id"
          done
