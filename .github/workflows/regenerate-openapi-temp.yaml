name: regenerate-openapi-temp

on:
  push:
    branches:
      - feat/assistant-token-usage
    paths:
      - api/api-server.yaml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-token-usage
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - run: make gen
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/entrypoints/webserver/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(api): regenerate OpenAPI server"
          git push origin HEAD:feat/assistant-token-usage
