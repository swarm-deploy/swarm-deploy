name: testing

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ui:
              - 'ui/**'
            backend:
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'tools/compatibility/**'
              - 'e2e/**'
              - '.github/workflows/testing.yaml'

  code-lint:
    name: code-lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: install deps
        run: sudo apt install gcc

      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.27.4'

      - name: Install Go dependencies
        run: go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          only-new-issues: false # show only new issues if it's a pull request
          args: -v --timeout=10m

  unit-test:
    name: unit-test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.27.4'

      - name: Install Go dependencies
        run: go mod download

      - name: Verify generated API
        if: needs.changes.outputs.backend == 'true'
        run: |
          go run -mod=mod github.com/ogen-go/ogen/cmd/ogen@v1.20.1 --config ./ogen.yml --target ./internal/entrypoints/webserver/generated --clean ./api/api-server.yaml
          git diff --exit-code -- internal/entrypoints/webserver/generated

      - name: Run full tests
        if: needs.changes.outputs.backend == 'true'
        run: go test ./internal/...

      - name: Compare native converter with Docker CLI
        if: needs.changes.outputs.backend == 'true'
        run: make test-compatibility

      - name: Test embedded UI
        if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.backend != 'true'
        run: go test ./internal/entrypoints/webserver/...

  frontend-test:
    name: frontend-test
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build UI
        run: npm run build

  docker-swarm-e2e:
    name: docker-swarm-e2e
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'

      - name: Initialize single-node Docker Swarm
        run: |
          docker version
          docker swarm init --advertise-addr 127.0.0.1
          docker pull busybox:1.36
          docker pull crazymax/swarm-cronjob:1.16.0
          docker pull registry:2

      - name: Test real Swarm deployments and scheduler integration
        env:
          SWARM_DEPLOY_E2E: '1'
        run: go test -count=1 -timeout=15m -v ./e2e -skip '^TestRealSwarmJobFailureRetryAndRecovery$'

      - name: Test real Swarm job failure and retry recovery
        env:
          SWARM_DEPLOY_E2E: '1'
        run: go test -count=1 -timeout=15m -v ./e2e -run '^TestRealSwarmJobFailureRetryAndRecovery$'

      - name: Collect Swarm diagnostics on failure
        if: failure()
        run: |
          docker info || true
          docker service ls || true
          docker stack ls || true
          docker service ps --no-trunc $(docker service ls --format '{{.Name}}') || true

      - name: Leave Swarm
        if: always()
        run: docker swarm leave --force || true
