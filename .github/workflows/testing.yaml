name: testing

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
            backend:
              - 'cmd/**'
              - 'internal/**'

  code-lint:
    name: code-lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: install deps
        run: sudo apt install gcc

      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: '1.26.3'

      - name: Install Go dependencies
        run: go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          only-new-issues: false # show only new issues if it's a pull request
          args: -v --timeout=10m

  unit-test:
    name: unit-test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build embedded UI
        working-directory: ui
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v4 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: '1.26.3'

      - name: Install Go dependencies
        run: go mod download

      - name: Verify generated API
        if: needs.changes.outputs.backend == 'true'
        run: |
          go run -mod=mod github.com/ogen-go/ogen/cmd/ogen@v1.20.1 --config ./ogen.yml --target ./internal/entrypoints/webserver/generated --clean ./api/api-server.yaml
          git diff --exit-code -- internal/entrypoints/webserver/generated

      - name: Run full tests
        if: needs.changes.outputs.backend == 'true'
        run: go test ./internal/...

      - name: Test embedded UI
        if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.backend != 'true'
        run: go test ./internal/entrypoints/webserver/...

  frontend-test:
    name: frontend-test
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build UI
        run: npm run build

  docker-swarm-e2e:
    name: docker-swarm-e2e
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Initialize single-node Docker Swarm
        run: |
          docker version
          docker swarm init --advertise-addr 127.0.0.1
          docker pull busybox:1.36

      - name: Test real Swarm resource reconciliation
        env:
          SWARM_DEPLOY_E2E: '1'
        run: go test -count=1 -timeout=10m -v ./e2e

      - name: Collect Swarm diagnostics on failure
        if: failure()
        run: |
          docker info || true
          docker service ls || true
          docker stack ls || true
          docker service ps --no-trunc $(docker service ls --format '{{.Name}}') || true

      - name: Leave Swarm
        if: always()
        run: docker swarm leave --force || true
